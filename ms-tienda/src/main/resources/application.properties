# Nombre de la aplicación.
spring.application.name=ms-tienda

# El microservicio estará disponible en http://localhost:8083.
server.port=8083

# ---------------------------------------------------------------
# BASE DE DATOS (MySQL de Laragon). La base se crea si no existe.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sonidovivo_tienda?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate solo VALIDA las tablas; las crea y modifica Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

# ---------------------------------------------------------------
# JWT: misma clave y emisor que ms-usuarios (este servicio solo VERIFICA tokens).
# ---------------------------------------------------------------
jwt.secreto=${JWT_SECRETO:sonido-vivo-clave-secreta-de-desarrollo-2026-cambiar-en-produccion}
jwt.emisor=sonido-vivo

app.cors.origenes=http://localhost:5173

# Reglas de negocio de la tienda
tienda.costo-despacho=5990
tienda.puntos-retiro=tienda,santiago-centro,las-condes

# Swagger UI en http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
