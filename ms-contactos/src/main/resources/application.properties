# Nombre de la aplicación.
spring.application.name=ms-contactos

# Servidor: localhost. Puerto: 3306 (MySQL de Laragon). Base de datos: sonidovivo_contactos.
# createDatabaseIfNotExist=true crea la base de datos si todavía no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/sonidovivo_contactos?createDatabaseIfNotExist=true&serverTimezone=America/Santiago

# Usuario para conectarse a MySQL (en Laragon: root sin contraseña).
spring.datasource.username=root
spring.datasource.password=

# Clase del controlador JDBC que permite conectarse con MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
# Valida que la estructura de las tablas coincida con las entidades.
# Hibernate no crea ni modifica tablas; esa tarea la realiza Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Muestra en la consola las sentencias SQL ejecutadas por Hibernate.
spring.jpa.show-sql=false
# Presenta las sentencias SQL con un formato más legible.
spring.jpa.properties.hibernate.format_sql=true

# El microservicio estará disponible en http://localhost:8082.
server.port=8082

# Habilita la ejecución de las migraciones pendientes al iniciar.
spring.flyway.enabled=true

# Corresponde a src/main/resources/db/migracion dentro del proyecto.
spring.flyway.locations=classpath:db/migracion

# La conexión a la BD se cierra al terminar cada petición (en una API REST no se necesita abierta).
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# JWT: misma clave y emisor que ms-usuarios (este servicio solo VERIFICA tokens).
# ---------------------------------------------------------------
jwt.secreto=${JWT_SECRETO:sonido-vivo-clave-secreta-de-desarrollo-2026-cambiar-en-produccion}
jwt.emisor=sonido-vivo

# Orígenes (frontend) que pueden llamar a esta API (antes estaba en @CrossOrigin del controlador).
app.cors.origenes=http://localhost:5173

# Swagger UI en http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
