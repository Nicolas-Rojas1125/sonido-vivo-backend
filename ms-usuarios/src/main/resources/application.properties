# Nombre de la aplicación.
spring.application.name=ms-usuarios

# El microservicio estará disponible en http://localhost:8081.
server.port=8081

# ---------------------------------------------------------------
# BASE DE DATOS (MySQL de Laragon). La base se crea si no existe.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sonidovivo_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate solo VALIDA las tablas; las crea y modifica Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# La conexión a la BD se cierra al terminar cada petición (API REST).
spring.jpa.open-in-view=false

# Migraciones en src/main/resources/db/migracion
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

# ---------------------------------------------------------------
# JWT
# ---------------------------------------------------------------
# Clave secreta para FIRMAR los tokens (HS256, mínimo 32 caracteres).
# Debe ser LA MISMA en ms-usuarios, ms-tienda y ms-contactos: así los otros microservicios
# pueden VERIFICAR los tokens sin consultar a ms-usuarios.
# En producción se entrega con la variable de entorno JWT_SECRETO (nunca se sube a GitHub).
jwt.secreto=${JWT_SECRETO:sonido-vivo-clave-secreta-de-desarrollo-2026-cambiar-en-produccion}
# Quién emite el token (claim "iss"); los otros microservicios lo validan.
jwt.emisor=sonido-vivo
# Duración del access token (corto: si alguien lo roba, sirve por poco tiempo).
jwt.minutos-acceso=15
# Duración del refresh token (permite renovar la sesión sin volver a escribir la contraseña).
jwt.dias-refresco=7
# La cookie del refresh token solo viaja por HTTPS si es true. En localhost (http) va en false.
jwt.cookie-segura=false

# Orígenes (frontend) que pueden llamar a esta API. Separar con comas.
app.cors.origenes=http://localhost:5173

# Swagger UI en http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
